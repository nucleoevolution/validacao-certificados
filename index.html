<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Validação de Certificado</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f4f6f8;
      margin: 0;
      padding: 40px;
      text-align: center;
    }

    .container {
      max-width: 520px;
      margin: auto;
      background: white;
      padding: 30px;
      border-radius: 12px;
      box-shadow: 0px 6px 18px rgba(0,0,0,0.12);
    }

    input {
      width: 80%;
      padding: 12px;
      font-size: 16px;
    }

    button {
      margin-top: 15px;
      padding: 12px 25px;
      font-weight: bold;
      background: #1a73e8;
      color: white;
      border: none;
      cursor: pointer;
    }

    #resultado {
      margin-top: 20px;
    }

    .ok {
      color: green;
      font-weight: bold;
    }

    .error {
      color: red;
      font-weight: bold;
    }

    .loading {
      color: #555;
    }
  </style>
</head>

<body>

<div class="container">

  <h2>Validação de Certificado</h2>

  <input id="codigo" placeholder="Digite o código">

  <br>

  <button onclick="verificar()">VERIFICAR</button>

  <div id="resultado"></div>

</div>

<script>

const APPS_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbwkZHLDH4w7SsCigmNX8QTjnmKHJd1wZiFczERnPx9v-DPXgUhwTZ-jn7RcEed_5C2p/exec";

async function verificar() {

  var codigo = document.getElementById("codigo").value.trim();

  if (!codigo) {
    document.getElementById("resultado").innerHTML =
      "<div class='error'>Digite o código</div>";
    return;
  }

  document.getElementById("resultado").innerHTML =
    "<div class='loading'>Verificando...</div>";

  try {

    const response = await fetch(APPS_SCRIPT_URL + "?codigo=" + encodeURIComponent(codigo));
    const res = await response.json();

    if (res.valido) {

      document.getElementById("resultado").innerHTML =
        "<div class='ok'>✔ CERTIFICADO VÁLIDO</div><br>" +
        "Nome: " + res.nome;

    } else {

      document.getElementById("resultado").innerHTML =
        "<div class='error'>❌ Certificado não encontrado</div>";
    }

  } catch (e) {

    document.getElementById("resultado").innerHTML =
      "<div class='error'>Erro ao conectar com o servidor</div>";
  }
}

</script>

</body>
</html>

<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Validação de Certificado</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f4f6f8;
      margin: 0;
      padding: 0;
      text-align: center;
    }

    /* LOGO */
    .top-logo {
      width: 100%;
      background: #ffffff;
      padding: 40px 0;
      border-bottom: 2px solid #eaeaea;
    }

    .top-logo img {
      width: 600px;
      max-width: 90%;
      display: block;
      margin: 0 auto;
    }

    /* CONTAINER */
    .container {
      max-width: 520px;
      margin: 40px auto;
      background: white;
      padding: 30px;
      border-radius: 12px;
      box-shadow: 0px 6px 18px rgba(0,0,0,0.12);
    }

    input {
      width: 85%;
      padding: 12px;
      font-size: 16px;
      border: 1px solid #ccc;
      border-radius: 6px;
    }

    button {
      margin-top: 15px;
      padding: 14px 25px;
      font-weight: bold;
      background: #1a73e8;
      color: white;
      border: none;
      cursor: pointer;
      border-radius: 6px;
      text-transform: uppercase;
    }

    #resultado {
      margin-top: 25px;
    }

    .ok {
      color: green;
      font-weight: bold;
    }

    .error {
      color: red;
      font-weight: bold;
    }

    .loading {
      color: #555;
    }
  </style>
</head>

<body>

<!-- LOGO (COLE SEU LINK AQUI) -->
<div class="top-logo">
  <img src="https://raw.githubusercontent.com/nucleoevolution/Logo_certificado/main/Sap%20Essentials%20logo%20EDIT.png" alt="Logo do Curso">
</div>

<div class="container">

  <h2>Validação de Certificado</h2>

  <input id="codigo" placeholder="Digite o código autenticador">

  <br>

  <button onclick="verificar()">VERIFICAR</button>

  <div id="resultado"></div>

</div>

<script>

const APPS_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbwkZHLDH4w7SsCigmNX8QTjnmKHJd1wZiFczERnPx9v-DPXgUhwTZ-jn7RcEed_5C2p/exec";

async function verificar() {

  var codigo = document.getElementById("codigo").value.trim();

  if (!codigo) {
    document.getElementById("resultado").innerHTML =
      "<div class='error'>Nenhum código digitado... Digite o código!</div>";
    return;
  }

  document.getElementById("resultado").innerHTML =
    "<div class='loading'>Verificando...</div>";

  try {

    const response = await fetch(APPS_SCRIPT_URL + "?codigo=" + encodeURIComponent(codigo));
    const res = await response.json();

    if (res.valido) {

      document.getElementById("resultado").innerHTML =
        "<div class='ok'>✅ CERTIFICADO VALIDADO EM NOSSO SISTEMA</div><br>" +
        "👤 Nome: " + res.nome;

    } else {

      document.getElementById("resultado").innerHTML =
        "<div class='error'>❌ Certificado não encontrado. Por favor, verifique se o código foi digitado de forma correta e tente novamente!</div>";
    }

  } catch (e) {

    document.getElementById("resultado").innerHTML =
      "<div class='error'>Erro ao conectar com o servidor</div>";
  }
}

</script>

</body>
</html>
